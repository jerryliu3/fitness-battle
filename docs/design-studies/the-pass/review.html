 added up.",idea:"Two capsule heads leave a rhythmic stitched line. The separated marks suggest accumulated sessions as well as motion, without pretending to be a heart-rate trace.",watch:"Avoid reading as an audio equalizer. Heads need noticeably more weight than the stitches.",lane:7,bg:"#819486",fg:"#fafaf7",rival:"#283e33"},{id:"paper-darts",name:"Paper darts",family:"Graphic",trail:!0,line:"A sharper kind of forward.",idea:"Two upright folded chevrons pull away on narrow vertical flight paths. The small fold brings a little physicality without adding a glossy material system.",watch:"Can imply navigation or sending a message. Test the pair together, never the dart alone.",lane:7,bg:"#282f2c",fg:"#f1c75b",rival:"#b6c4b8"},{id:"elastic-sparks",name:"Elastic sparks",family:"Character",trail:!0,line:"Energy with a softer edge.",idea:"Two four-point sparks stretch upward with elastic tails. This is an alternate star language: simpler and more abstract than Ember, with broad curves that remain tactile.",watch:"This is a new symbol, not a replacement Ember rig. Sparkle is a common category cue.",lane:2,bg:"#f1c75b",fg:"#282f2c",rival:"#fffdf4"},{id:"little-rivals",name:"Little rivals",family:"Character",trail:!0,line:"Friendly faces. Serious little race.",idea:"Soft bean-shaped racers with tiny eyes and a comic wake. A deliberately playful end of the spectrum, with a small raised edge that can extend into lane tokens.",watch:"Faces are a bonus at large sizes. The two offset bean silhouettes must remain legible without them.",lane:5,bg:"#e6ece1",fg:"#f1c75b",rival:"#819486"},{id:"open-track",name:"Open track",family:"Essential",trail:!1,line:"The field becomes the mark.",idea:"Two tokens sit between three open lane rules. No speed trail: the empty track and relative positions supply the story. Closest to a tiny view of the actual application.",watch:"Extra lane lines compete with the heads at favicon scale. The icon may need a simpler micro version.",lane:6,bg:"#fafaf7
