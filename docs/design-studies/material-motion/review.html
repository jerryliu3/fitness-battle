#ot-experiences .ot-week-selector select{font-size:16px}}
&lt;/style&gt;

    get(&#x27;ot-flip&#x27;).textContent = state.flipped ? &#x27;Show the object&#x27; : &#x27;Flip to record&#x27;;

  root.querySelectorAll(&#x27;button[data-material]&#x27;).forEach(el =&gt; el.addEventListener(&#x27;click&#x27;, () =&gt; {

  root.querySelectorAll(&#x27;[data-object]&#x27;).forEach(el =&gt; el.addEventListener(&#x27;click&#x27;, () =&gt; {

  get(&#x27;ot-flip&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { state.flipped = !state.flipped; object(); save(&#x27;Forged Week&#x27;); });

  const weeks = [
    { date: &#x27;Aug 31&#x27;, axis: &#x27;8/31&#x27;, bounds: &#x27;AUG 31–SEP 7 / UTC&#x27;, total: 24.6 },
    { date: &#x27;Sep 7&#x27;, axis: &#x27;9/7&#x27;, bounds: &#x27;SEP 7–14 / UTC&#x27;, total: 28.1 },
    { date: &#x27;Sep 14&#x27;, axis: &#x27;9/14&#x27;, bounds: &#x27;SEP 14–21 / UTC&#x27;, total: 23.8 },
    { date: &#x27;Sep 21&#x27;, axis: &#x27;9/21&#x27;, bounds: &#x27;SEP 21–28 / UTC&#x27;, total: 32.4 },
    { date: &#x27;Sep 28&#x27;, axis: &#x27;9/28&#x27;, bounds: &#x27;SEP 28–OCT 5 / UTC&#x27;, total: 26.7 },
    { date: &#x27;Oct 5&#x27;, axis: &#x27;10/5&#x27;, bounds: &#x27;OCT 5–12 / UTC&#x27;, total: 30.6 },
    { date: &#x27;Oct 12&#x27;, axis: &#x27;10/12&#x27;, bounds: &#x27;OCT 12–19 / UTC&#x27;, total: 19.2, partial: true },
  ];
  weeks.forEach((week, index) =&gt; {
    const option = document.createElement(&#x27;option&#x27;);
    option.value = String(index);
    option.textContent = week.date + (week.partial ? &#x27; · This week so far&#x27; : &#x27; · Complete week&#x27;);

  });
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  function svgNode(tag, attributes, parent, text) {
    const node = document.createElementNS(ns, tag);

  }
  function chartBase(container, height, label) {

    if (!width) return null;

  }
  function weekChart() {
    const base = chartBase(get(&#x27;ot-week-chart&#x27;), 210, &#x27;Weekly running distance in kilometers. Current week is partial. Select a week using the selector below.&#x27;);
    if (!base) return;
    const { width, svg } = base;
    const left = 30, right = width - 9, top = 17, bottom = 177;
    const ceiling = Math.ceil(Math.max(...weeks.map(w =&gt; w.total)) / 10) * 10;
    const x = i =&gt; left + (i + .5) * (right - left) / weeks.length;
    const y = value =&gt; bottom - value / ceiling * (bottom - top);
    for (const tick of [0, ceiling / 2, ceiling]) {
      svgNode(&#x27;line&#x27;, { x1: left, x2: right, y1: y(tick), y2: y(tick), stroke: &#x27;var(--ot-line)&#x27;, &#x27;stroke-width&#x27;: 1 }, svg);
      svgNode(&#x27;text&#x27;, { x: left - 8, y: y(tick) + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, fill: &#x27;var(--ot-muted)&#x27;, &#x27;font-size&#x27;: 11 }, svg, tick);
    }
    svgNode(&#x27;text&#x27;, { x: 0, y: 10, fill: &#x27;var(--ot-muted)&#x27;, &#x27;font-size&#x27;: 11 }, svg, &#x27;km&#x27;);
    const defs = svgNode(&#x27;defs&#x27;, {}, svg);
    const pattern = svgNode(&#x27;pattern&#x27;, { id: &#x27;ot-partial-hatch&#x27;, width: 5, height: 5, patternUnits: &#x27;userSpaceOnUse&#x27;, patternTransform: &#x27;rotate(35)&#x27; }, defs);
    svgNode(&#x27;rect&#x27;, { width: 5, height: 5, fill: &#x27;var(--ot-wash)&#x27; }, pattern);
    svgNode(&#x27;line&#x27;, { x1: 0, x2: 0, y1: 0, y2: 5, stroke: &#x27;var(--ot-muted)&#x27;, &#x27;stroke-width&#x27;: 2 }, pattern);
    if (state.chart === &#x27;line&#x27;) {
      const points = weeks.slice(0, -1).map((w, i) =&gt; `${x(i)},${y(w.total)}`).join(&#x27; &#x27;);
      svgNode(&#x27;polyline&#x27;, { points, fill: &#x27;none&#x27;, stroke: &#x27;var(--ot-ink)&#x27;, &#x27;stroke-width&#x27;: 2 }, svg);
      svgNode(&#x27;line&#x27;, { x1: x(5), y1: y(weeks[5].total), x2: x(6), y2: y(weeks[6].total), stroke: &#x27;var(--ot-muted)&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;4 4&#x27;, &#x27;stroke-width&#x27;: 2 }, svg);

      const selected = state.week === i;

        : svgNode(&#x27;circle&#x27;, { cx: x(i), cy: y(week.total), r: selected ? 6 : 4, fill: week.partial ? &#x27;var(--ot-paper)&#x27; : &#x27;var(--ot-ink)&#x27;, stroke: &#x27;var(--ot-ink)&#x27;, &#x27;stroke-width&#x27;: 2 }, svg);
      mark.style.cursor = &#x27;pointer&#x27;;
      svgNode(&#x27;title&#x27;, {}, mark, `${week.date}: ${week.total} km${week.partial ? &#x27;, partial&#x27; : &#x27;&#x27;}`);
      mark.addEventListener(&#x27;click&#x27;, () =&gt; { state.week = i; training(); save(&#x27;Weekly Training&#x27;); });
      if (selected) svgNode(&#x27;text&#x27;, { x: x(i), y: y(week.total) - 12, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, fill: &#x27;var(--ot-ink)&#x27;, &#x27;font-size&#x27;: 12 }, svg, week.total.toFixed(1));

    });
  }
  function training() {
    const week = weeks[state.week];
    get(&#x27;ot-week-select&#x27;).value = String(state.week);
    get(&#x27;ot-week-bounds&#x27;).textContent = week.bounds;
    get(&#x27;ot-week-total&#x27;).textContent = week.total.toFixed(1);
    get(&#x27;ot-week-status&#x27;).textContent = (week.partial ? &#x27;This week so far&#x27; : &#x27;Complete week&#x27;) + &#x27; · 3 counted sessions&#x27;;
    const distances = week.partial ? [5.9, 7.1, 6.2] : [Math.round(week.total * 3) / 10, Math.round(week.total * 3.5) / 10];

      for (const text of [[&#x27;Easy run&#x27;, &#x27;Park loop&#x27;, &#x27;Long run&#x27;][i], distance.toFixed(1) + &#x27; km&#x27;]) {
        const span = document.createElement(&#x27;span&#x27;); span.textContent = text; row.append(span);

  get(&#x27;ot-week-select&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; { state.week = Number(event.target.value); training(); save(&#x27;Weekly Training&#x27;); });

  function clock() {
    const walk = state.event === &#x27;walk&#x27;;
    get(&#x27;ot-clock-time&#x27;).textContent = walk ? &#x27;18:00&#x27; : &#x27;07:30&#x27;;
    get(&#x27;ot-clock-center-title&#x27;).textContent = walk ? &#x27;Evening walk&#x27; : &#x27;Morning run&#x27;;
    get(&#x27;ot-clock-detail-time&#x27;).textContent = walk ? &#x27;18:00–18:25&#x27; : &#x27;07:30–08:04&#x27;;
    get(&#x27;ot-clock-detail-title&#x27;).textContent = walk ? &#x27;Evening walk&#x27; : &#x27;Morning run&#x27;;

  const recordDates = [&#x27;May 10, 2026&#x27;, &#x27;Jun 14, 2026&#x27;, &#x27;Aug 2, 2026&#x27;, &#x27;Oct 4, 2026&#x27;];
  const recordDays = [Date.UTC(2026, 4, 10), Date.UTC(2026, 5, 14), Date.UTC(2026, 7, 2), Date.UTC(2026, 9, 4)];
  const races = {
    &#x27;5&#x27;: { event: &#x27;5K&#x27;, seconds: [1470, 1452, 1438, 1422] },
    &#x27;10&#x27;: { event: &#x27;10K&#x27;, seconds: [3062, 3035, 3008, 2958] },
    &#x27;21&#x27;: { event: &#x27;Half&#x27;, seconds: [6990, 6900, 6830, 6726] },
  };
  const time = seconds =&gt; {
    const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
    return (h ? h + &#x27;:&#x27; + String(m).padStart(2, &#x27;0&#x27;) : String(m)) + &#x27;:&#x27; + String(s).padStart(2, &#x27;0&#x27;);
  };
  function prChart() {
    const race = races[state.distance];
    const base = chartBase(get(&#x27;ot-pr-chart&#x27;), 152, `Standing ${race.event} personal record from May to October. Lower elapsed time is faster. Inspect milestones with the month buttons below.`);

    for (const tick of [race.seconds[0], race.seconds[3]]) {

      svgNode(&#x27;text&#x27;, { x: 47, y: y(tick) + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, fill: &#x27;var(--ot-muted)&#x27;, &#x27;font-size&#x27;: 11 }, svg, time(tick));
