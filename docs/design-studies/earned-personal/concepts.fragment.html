const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const avatar=(kind='person')=>`<span class="ep-avatar">${kind==='ember'?`<img src="${ember}" alt="Ember">`:icon('user-round')}</span>`;
const top=(title,back=false)=>`<div class="ep-top"><strong>${back?'‹ &nbsp; Home':'overtaek'}</strong><span>${title}</span>${avatar('ember')}</div>`;
const nav=(tab)=>`<div class="ep-nav">${[['Home','house'],['Compete','flag'],['Progress','chart-no-axes-combined'],['Crew','users-round']].map(([name,i])=>`<span class="${tab===name?'ep-current':''}">${icon(i)}${name}</span>`).join('')}</div>`;
const rule=()=>`<div class="ep-row"><small>Active · Running · Open</small><span class="ep-badge ep-gold">+1 / 2 mi</span></div>`;
const progress=()=>`<div class="ep-track" role="progressbar" aria-label="Progress toward the next Effort Score point" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1.3"><span style="width:65%"></span></div>`;
const impact=()=>`<div class="ep-impact"><div class="ep-row"><b>Your week now</b><span class="ep-badge ep-gold">+3 from activity</span></div>${progress()}<div class="ep-row"><span>0.7 mi to your next +1</span><small>Open</small></div></div>`;
const stats=(distance='4.2 mi',minutes='38 min')=>`<div class="ep-statline"><div><b>${distance}</b><small>Distance</small></div><div><b>${minutes}</b><small>Moving time</small></div><div><b>142</b><small>Avg bpm</small></div></div>`;
const session=(name,dist,time,open=false)=>`<details class="ep-session" ${open?'open':''}><summary><span class="ep-row-start"><span class="ep-sport">${icon('footprints')}</span><span class="ep-stack"><b>${name}</b><small>${time} · ${dist}</small></span></span></summary><p>Strava · GPS verified · Counted<br>${name==='Evening walk'?'18 min moving time':'38 min moving time · 142 avg bpm'}</p></details>`;
const suggested=()=>`<div class="ep-row"><div class="ep-stack"><p class="ep-kicker">Today's suggestion</p><h2>An easy 25.</h2><p class="ep-muted">Keep it conversational.</p></div><img class="ep-ember" src="${ember}" alt="Ember"></div><p class="ep-muted">A lighter session after your last active day.</p><div class="ep-row"><button class="ep-primary cursor-interaction" data-demo-action="add">Add activity</button><button class="ep-secondary cursor-interaction" data-demo-action="sync">Sync</button></div><small>Nothing recorded today</small>`;
const weeklyValues=[8,14,11,19,13,16,7.3];
const bars=(vals=weeklyValues,selected=6)=>`<div class="ep-volume-bars" role="group" aria-label="Choose a training week">${vals.map((v,i)=>`<button type="button" class="cursor-interaction" data-week="${i}" aria-pressed="${i===selected}" aria-label="Week ${i+1}, ${v} miles${i===6?', partial week':''}" style="height:${v/Math.max(...vals)*100}%"></button>`).join('')}</div><div class="ep-chart-labels"><span>Sep 7</span><span>Sep 28</span><span>Oct 19</span></div>`;
const hoursChart=()=>`<div class="ep-volume-bars" role="img" aria-label="Cumulative moving hours this week: Monday 0.4, Tuesday 1.1, Wednesday 2.4. Future days have no data.">${[.4,1.1,2.4,0,0,0,0].map(v=>`<span style="flex:1;height:${v/2.4*100}%;background:var(--ep-gold);border-radius:5px 5px 0 0"></span>`).join('')}</div><div class="ep-chart-labels">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div>`;
const mini=(seed=1)=>`<div class="ep-mini-bars" aria-hidden="true">${[2,7,4,1,8,5,3].map((v,i)=>`<i style="height:${((v*seed+i)%9+1)*10}%"></i>`).join('')}</div>`;
const filter=()=>`<div class="ep-seg" role="group" aria-label="History track"><button type="button" class="cursor-interaction" data-track="Open" aria-pressed="true">Running · Open</button><button type="button" class="cursor-interaction" data-track="GPS" aria-pressed="false">Running · GPS</button></div>`;
const scoreChart=()=>`<svg class="ep-chart" viewBox="0 0 320 160" role="img" aria-label="Fictional settled-week Effort Score steps from 1000 to 1084"><line x1="45" y1="20" x2="45" y2="125" stroke="var(--ep-line)"/><line x1="45" y1="125" x2="305" y2="125" stroke="var(--ep-line)"/><line x1="45" y1="72" x2="305" y2="72" stroke="var(--ep-line)"/><text x="0" y="24">1,100</text><text x="0" y="76">1,050</text><text x="0" y="129">1,000</text><path d="M45 125 H91 V91.4 H180 V95.6 H225 V62 H265 V36.8 H300" fill="none" stroke="var(--ep-ink)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="265" cy="36.8" r="5" fill="var(--ep-gold)"/><text x="45" y="151">Sep 7</text><text x="244" y="151">Oct 18</text></svg>`;
const people=['Maya','You','Leo','Sam'];
const racers=['Maya','Leo','You','Sam'];
const crewValues=[32,19.2,24.8,0];
const personButtons=()=>`<div class="ep-people">${people.map((n,i)=>`<button type="button" class="ep-person cursor-interaction" data-person="${i}" aria-pressed="${i===1}" aria-label="Inspect ${n}'s crew contribution">${avatar(i===1?'ember':'person')}<span>${n}</span></button>`).join('')}</div>`;
const club=()=>`<div class="ep-club"><small>RUNNING CREW · 4 MEMBERS</small><h2 style="margin-top:12px">Northside Club</h2><p style="margin-top:6px">Different runs. One shared week.</p></div>`;
const crewDetail=()=>`<div class="ep-card" data-crew-detail aria-live="polite"><div class="ep-row"><div class="ep-stack"><p class="ep-kicker">Your contribution</p><h2>19.2 km</h2><small>3 sessions · 25.3% of recorded distance</small></div>${avatar('ember')}</div></div>`;
const tape=()=>`<div class="ep-tape" aria-label="76 of 100 kilometers contributed by the crew"><button type="button" class="cursor-interaction" style="width:32%" data-person="0" aria-label="Maya, 32 kilometers" aria-pressed="false">Maya</button><button type="button" class="cursor-interaction" style="width:19.2%" data-person="1" aria-label="You, 19.2 kilometers" aria-pressed="true">You</button><button type="button" class="cursor-interaction" style="width:24.8%" data-person="2" aria-label="Leo, 24.8 kilometers" aria-pressed="false">Leo</button><span class="ep-finish" aria-hidden="true"></span><span class="ep-target">100 km</span></div>`;
const field=(kind)=>{
 const far=kind==='wide',close=['local','overview'].includes(kind),pilot=kind==='pilot',portrait=kind==='portrait',pennant=kind==='pennant'||far;
 const labels=far?['+3 km','You','−3 km']:close?['+600 m','You','−600 m']:['+1 km','You','−1 km'];
 return `<div class="ep-field ${far?'ep-far':close?'ep-close':''}"><div class="ep-ranks"><b>1st</b><b>2nd</b><b class="ep-you">3rd · You</b><b>4th</b></div>${[16,38,60,82].map(x=>`<span class="ep-lane" style="left:${x}%"></span>`).join('')}${[0,1,2,3].map((i)=>`<button type="button" class="ep-racer cursor-interaction ${i===0?'ep-first':''}" style="left:${[16,38,60,82][i]}%;top:${[26.9,42.5,58.1,81.5][i]}%" data-racer="${i}" aria-label="${racers[i]}, place ${i+1}" aria-pressed="${i===2}">${pilot?`<img src="${ember}" alt="Ember pilot">`:portrait?avatar(i===2?'ember':'person'):''}${pennant&&i===2?`<span class="ep-place-flag">${avatar('ember')}You</span>`:''}${!far&&!pennant?`<span class="ep-name-tag">${racers[i]}</span>`:''}</button>`).join('')}<div class="ep-ticks"><span>${labels[0]}</span><span>${labels[1]}</span><span>${labels[2]}</span></div></div>`;
};
const states={day:'Two sessions'};
function sessionScreen(el,kind){
 const empty=states.day==='Nothing recorded',one=states.day==='One session';
 const list=session('Morning run','4.2 mi','7:10 am')+(one?'':session('Evening walk','1.1 mi','6:20 pm'));
 let content='';
 if(kind==='daybook')content=empty?`${suggested()}<hr class="ep-divider"><p class="ep-kicker">Your week</p>${impact()}`:`<div class="ep-stack"><p class="ep-kicker">Wednesday · Oct 21</p><h1>You made<br>room to move.</h1></div><div class="ep-row"><div><div class="ep-hero">${one?'38':'56'}<span> min</span></div><p class="ep-muted">${one?'One session':'Two sessions'} in your day</p></div><img class="ep-ember" src="${ember}" alt="Ember"></div>${impact()}<div>${list}</div><button class="ep-secondary cursor-interaction" data-demo-action="add">${icon('plus')} Add activity</button>`;
 if(kind==='stage')content=empty?`<p class="ep-kicker">Today's briefing</p><h1>A little movement.<br>A better day.</h1><div class="ep-clock"><div><p class="ep-kicker">Suggested</p><div class="ep-hero">25<span> min</span></div></div><img class="ep-ember" src="${ember}" alt="Ember"></div>${suggested()}`:`<p class="ep-kicker">Wednesday · Morning run</p><h1>This one's<br>in the books.</h1><div class="ep-clock"><div><p class="ep-kicker">Counted distance</p><div class="ep-hero">4.2<span> mi</span></div></div><img class="ep-ember" src="${ember}" alt="Ember"></div>${stats()}<span class="ep-badge">${icon('check')} GPS verified · Counted</span>${impact()}${one?'':`<details class="ep-session"><summary><b>2 sessions today</b></summary><p>Morning run · 4.2 mi<br>Evening walk · 1.1 mi</p></details>`}`;
 if(kind==='receipt')content=`<p class="ep-kicker">Wednesday · Oct 21</p><h1>${empty?'Make your move.':'Your day, counted.'}</h1><div class="ep-seg" role="group" aria-label="Session view"><button type="button" class="cursor-interaction" data-receipt="overview" aria-pressed="true">Overview</button><button type="button" class="cursor-interaction" data-receipt="impact" aria-pressed="false">Impact</button></div><div data-receipt-panel="overview">${empty?suggested():`<div class="ep-card"><p class="ep-kicker">${one?'1 session':'2 sessions'}</p><div class="ep-hero">${one?'38':'56'}<span> min</span></div><p class="ep-muted">Recorded time today</p></div>${list}`}</div><div data-receipt-panel="impact" hidden><div class="ep-center"><img class="ep-ember" src="${ember}" alt="Ember"><h2>${empty?'Every counted mile builds.':'A little further this week.'}</h2></div><div style="margin-top:20px">${impact()}</div><p class="ep-muted" style="margin-top:16px">Active running earns +1 per 2 mi this round.</p></div>`;
 el.innerHTML=top('Your day',true)+`<div class="ep-body">${content}</div>`;
}
function racerScreen(el,kind){el.innerHTML=top('Compete')+`<div class="ep-body"><div class="ep-row"><h1>Your field.</h1><span class="ep-badge">Running · Open</span></div>${field(kind)}<div class="ep-card" data-racer-detail aria-live="polite"><div class="ep-row"><div class="ep-row-start">${avatar('ember')}<div class="ep-stack"><b>You · 3rd</b><small>7.3 mi this week</small></div></div><span class="ep-badge">Your racer</span></div></div></div>`+nav('Compete');}
function scaleScreen(el,kind){el.innerHTML=top('Compete')+`<div class="ep-body"><div class="ep-row"><h2>${kind==='wide'?'The whole field.':'The next stretch.'}</h2><span class="ep-badge">Running · Open</span></div>${field(kind)}${kind==='overview'?`<div><div class="ep-row"><small>Whole-field overview</small><small>1.2 km window</small></div><div class="ep-small-map" role="img" aria-label="Detailed window within a larger 12 kilometer course"><span></span></div><div class="ep-chart-labels"><span>0 km</span><span>12 km</span></div></div>`:`<div class="ep-row"><small>${kind==='wide'?'6 km visible · 100 m heads':'1.2 km visible · 100 m heads'}</small><small>Illustrative scale</small></div>`}<div class="ep-impact"><div class="ep-row"><b>3rd · You</b><span>7.3 mi</span></div><small>Place changes. Your lane stays yours.</small></div></div>`+nav('Compete');}
function progressScreen(el,kind){
 let content='';
 if(kind==='chapters')content=`<div class="ep-stack"><p class="ep-kicker">Past weeks</p><h1>A month of<br>showing up.</h1></div><div class="ep-card"><div class="ep-row"><div class="ep-stack"><small>October · 3 settled weeks</small><h2>Two podium finishes.</h2></div><span class="ep-badge ep-gold">2 / 3</span></div></div><div><p class="ep-kicker">October</p>${[['2nd','Oct 12–18','18.6 mi','+24'],['1st','Oct 5–11','21.0 mi','+32'],['4th','Sep 28–Oct 4','13.2 mi','−4']].map(([place,date,vol,delta],i)=>`<details class="ep-session"><summary><span class="ep-row-start"><span class="ep-place ${i===1?'ep-gold':''}">${place}</span><span class="ep-stack"><b>${date}</b><small>${vol} · ${place} of 8</small></span></span><b>${delta}</b></summary><p>Settled result · Running · <span data-track-label>Open</span><br>Full result and score receipt.</p></details>`).join('')}</div>`;
 if(kind==='journey')content=`<div class="ep-row"><div><p class="ep-kicker">Effort Score</p><div class="ep-hero" data-journey-score>1,084</div></div><span class="ep-badge ep-gold">Active</span></div>${scoreChart()}<div class="ep-seg" role="group" aria-label="Inspect a settled week">${['Oct 4','Oct 11','Oct 18'].map((n,i)=>`<button type="button" class="cursor-interaction" data-score-week="${i}" aria-pressed="${i===2}">${n}</button>`).join('')}</div><div class="ep-card" data-score-detail aria-live="polite"><p class="ep-kicker">Oct 12–18 · Settled</p><h2>2nd of 8</h2><p>1,060 → 1,084 Effort Score</p><small>+24 at weekly settlement</small></div><details class="ep-session"><summary><b>Activity milestones this week</b></summary><p>+3 from counted running. Current aggregate milestone awards are shown separately from this settled-week chart.</p></details>`;
 if(kind==='atlas')content=`<div class="ep-row"><h1>Training atlas.</h1><span class="ep-badge">October</span></div><div class="ep-chart-labels">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div><div class="ep-calendar" role="group" aria-label="October activity days">${Array.from({length:28},(_,i)=>`<button type="button" class="cursor-interaction ${[0,2,5,8,11,14,16,18,20].includes(i)?'ep-trained':''}" data-day="${i+1}" aria-pressed="${i===20}" aria-label="October ${i+1}">${i+1}</button>`).join('')}</div><div class="ep-row"><h3>Weekly distance</h3><small>mi</small></div>${bars()}<div class="ep-card" data-week-detail aria-live="polite"><p class="ep-kicker">Oct 19 · Current partial week</p><h2>7.3 mi · 3 sessions</h2><small>Time, distance and sessions for this selection</small></div>`;
 el.innerHTML=top('Progress')+`<div class="ep-body">${filter()}${content}</div>`+nav('Progress');
}
function crewScreen(el,kind){
 let content=club();
 if(kind==='shelf')content+=`<div class="ep-row"><div><p class="ep-kicker">This week, together</p><div class="ep-hero">76<span> / 100 km</span></div></div></div>${tape()}${personButtons()}${crewDetail()}`;
 if(kind==='relay')content+=`<div class="ep-stack"><p class="ep-kicker">One finish line</p><div class="ep-hero">76<span> / 100 km</span></div><p class="ep-muted">24 km to go, together.</p></div>${tape()}${crewDetail()}${personButtons()}`;
 if(kind==='expedition')content+=`<div class="ep-row"><div><h2>24 km to the flag.</h2><small>76 / 100 km together</small></div></div><div class="ep-expedition"><svg class="ep-chart" viewBox="0 0 320 230" role="img" aria-label="Schematic crew journey, 76 of 100 kilometers"><path d="M30 194 C130 194 294 195 284 142 C280 96 40 150 54 89 C63 45 240 75 270 32" fill="none" stroke="var(--ep-line)" stroke-width="9" stroke-linecap="round"/><path d="M30 194 C130 194 294 195 284 142 C280 96 40 150 54 89 C58 69 102 62 151 62" fill="none" stroke="var(--ep-gold)" stroke-width="9" stroke-linecap="round"/><text x="248" y="23">100 km</text><text x="15" y="222">0 km</text></svg><div class="ep-avatar-stack">${avatar()}${avatar('ember')}${avatar()}</div></div>${personButtons()}${crewDetail()}`;
 el.innerHTML=top('Crew')+`<div class="ep-body">${content}</div>`+nav('Crew');
}
function scoreScreen(el,kind){let content='';
 if(kind==='rail')content=`<div class="ep-row"><div><p class="ep-kicker">Your week</p><div class="ep-hero">2.4<span> hr</span></div></div><img class="ep-ember" src="${ember}" alt="Ember"></div>${hoursChart()}<div class="ep-card">${rule()}<h2>0.7 mi to your<br>next +1.</h2>${progress()}<div class="ep-row"><small>1.3 / 2 mi</small><small>+3 from activity this week</small></div><details><summary>How this works</summary><p style="margin-top:10px">Your entry rank fixes +1 per 2 mi for running this round. Only eligible counted activity contributes.</p></details></div><div class="ep-row"><h3>Your recent sessions</h3>${icon('arrow-down-right')}</div>${session('Morning run','4.2 mi','7:10 am')}`;
 if(kind==='impact')content=`<p class="ep-kicker">Morning run · Counted</p><h1>More than<br>miles in a log.</h1><div class="ep-row"><div class="ep-hero">4.2<span> mi</span></div><img class="ep-ember" src="${ember}" alt="Ember"></div><div class="ep-card"><p class="ep-kicker">What this added</p><div class="ep-row"><b>This week's running</b><b>+4.2 mi</b></div><div class="ep-row"><b>Crew distance</b><b>+6.8 km</b></div><hr class="ep-divider"><small>Your week now · Running · Open</small><h2>+3 from activity.</h2>${progress()}<p>0.7 mi to the next point</p></div><small>Weekly totals shown. A session-specific score award requires an attributable receipt.</small>`;
 if(kind==='anatomy')content=`<p class="ep-kicker">Running · Open</p><div class="ep-row"><div class="ep-hero">1,087</div><span class="ep-badge ep-gold">Active</span></div><div class="ep-card"><h2>Where your score moves.</h2><div class="ep-source-row"><span>Activity this week</span><span class="ep-source-bar"><i style="width:35%"></i></span><b>+3</b></div><div class="ep-source-row"><span>Latest settlement</span><span class="ep-source-bar"><i style="width:100%;background:var(--ep-sage)"></i></span><b>+24</b></div><small>Separate events and periods; not a full score breakdown.</small></div><div class="ep-card">${rule()}<h3>Your next milestone</h3><div class="ep-score-steps" role="img" aria-label="Three full milestones and sixty-five percent of the next">${[0,1,2].map(()=>'<i class="ep-done"></i>').join('')}<i class="ep-part"></i></div><p>7.3 mi counted · 0.7 mi to +1</p><small>Price fixed at round entry. Open and GPS are tracked independently.</small></div><details class="ep-session"><summary><b>How weekly settlement works</b></summary><p>Weekly placement can change your score separately. Frozen and idle weeks have their own rules.</p></details>`;
 el.innerHTML=top(kind==='rail'?'Home':kind==='impact'?'Session impact':'Progress')+`<div class="ep-body">${content}</div>`+(kind==='impact'?'':nav(kind==='rail'?'Home':'Progress'));
}
function renderAll(){root.querySelectorAll('[data-screen]').forEach(el=>{const kind=el.dataset.screen;if(['daybook','stage','receipt'].includes(kind))sessionScreen(el,kind);else if(['portrait','pilot','pennant'].includes(kind))racerScreen(el,kind);else if(['local','wide','overview'].includes(kind))scaleScreen(el,kind);else if(['chapters','journey','atlas'].includes(kind))progressScreen(el,kind);else if(['shelf','relay','expedition'].includes(kind))crewScreen(el,kind);else scoreScreen(el,kind);});if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}
renderAll();
const topicPicker=root.querySelector('#ep-topic');
const conceptPicker=root.querySelector('#ep-variant');
const sessionPicker=root.querySelector('#ep-session-state');
function showConcept(){
 const panel=root.querySelector('#'+topicPicker.value);
 panel.querySelectorAll('[data-variant]').forEach(variant=>variant.hidden=variant.dataset.variant!==conceptPicker.value);
}
function showTopic(){
 root.querySelectorAll('[data-topic-panel]').forEach(panel=>panel.hidden=panel.id!==topicPicker.value);
 const panel=root.querySelector('#'+topicPicker.value);
 conceptPicker.replaceChildren(...Array.from(panel.querySelectorAll('[data-variant]'),variant=>new Option(variant.dataset.variant,variant.dataset.variant)));
 root.querySelector('#ep-state-control').hidden=topicPicker.value!=='ep-session';
 showConcept();
}
topicPicker.addEventListener('change',showTopic);
conceptPicker.addEventListener('change',showConcept);
sessionPicker.addEventListener('change',()=>{states.day=sessionPicker.value;renderAll();});
showTopic();
root.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 const phone=button.closest('.ep-phone');if(!phone)return;
 if(button.dataset.person!==undefined){const i=Number(button.dataset.person);phone.querySelectorAll('[data-person]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.person===String(i))));const details=phone.querySelector('[data-crew-detail]');if(details)details.innerHTML=`<div class="ep-row"><div class="ep-stack"><p class="ep-kicker">${people[i]==='You'?'Your':people[i]+"'s"} contribution</p><h2>${crewValues[i]} km</h2><small>${[4,3,3,0][i]} sessions · ${(crewValues[i]/76*100).toFixed(1)}% of recorded distance</small></div>${avatar(i===1?'ember':'person')}</div>`;}
 if(button.dataset.racer!==undefined){const i=Number(button.dataset.racer);phone.querySelectorAll('[data-racer]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const d=phone.querySelector('[data-racer-detail]');if(d)d.innerHTML=`<div class="ep-row"><div class="ep-row-start">${avatar(i===2?'ember':'person')}<div class="ep-stack"><b>${racers[i]} · ${['1st','2nd','3rd','4th'][i]}</b><small>${[7.8,7.5,7.3,6.9][i]} mi this week</small></div></div><span class="ep-badge">${i===2?'Your racer':i<2?'Ahead of you':'Behind you'}</span></div>`;}
 if(button.dataset.receipt){phone.querySelectorAll('[data-receipt]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));phone.querySelectorAll('[data-receipt-panel]').forEach(p=>p.hidden=p.dataset.receiptPanel!==button.dataset.receipt);}
 if(button.dataset.track){phone.querySelectorAll('[data-track]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));phone.querySelectorAll('[data-track-label]').forEach(s=>s.textContent=button.dataset.track);}
 if(button.dataset.scoreWeek!==undefined){const i=Number(button.dataset.scoreWeek);phone.querySelectorAll('[data-score-week]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));phone.querySelector('[data-journey-score]').textContent=[1028,1060,1084][i].toLocaleString();phone.querySelector('[data-score-detail]').innerHTML=`<p class="ep-kicker">${['Sep 28–Oct 4','Oct 5–11','Oct 12–18'][i]} · Settled</p><h2>${['4th','1st','2nd'][i]} of 8</h2><p>${[1032,1028,1060][i].toLocaleString()} → ${[1028,1060,1084][i].toLocaleString()} Effort Score</p><small>${['−4','+32','+24'][i]} at weekly settlement</small>`;}
 if(button.dataset.week!==undefined){phone.querySelectorAll('[data-week]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const d=phone.querySelector('[data-week-detail]');if(d)d.innerHTML=`<p class="ep-kicker">Selected week ${Number(button.dataset.week)+1}</p><h2>${weeklyValues[Number(button.dataset.week)]} mi</h2><small>Fictional weekly training receipt</small>`;}
 if(button.dataset.day){phone.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));phone.querySelector('[data-week-detail]').innerHTML=`<p class="ep-kicker">October ${button.dataset.day}</p><h2>${[1,3,6,9,12,15,17,19,21].includes(Number(button.dataset.day))?'Activity recorded':'Nothing recorded'}</h2><small>Selected day in your training history</small>`;}
 if(button.dataset.demoAction){let message=phone.querySelector('[data-action-message]');if(!message){message=document.createElement('p');message.setAttribute('data-action-message','');message.setAttribute('role','status');message.className='ep-impact';button.closest('.ep-body').append(message);}message.textContent=button.dataset.demoAction==='add'?'Concept handoff → existing manual activity form':'Concept handoff → existing tracker sync';}
 if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});
});
const saved=window.openai?.widgetState?.modelContent;
if(saved?.sessionState&&['Nothing recorded','One session','Two sessions'].includes(saved.sessionState)){states.day=saved.sessionState;sessionPicker.value=states.day;renderAll();}
window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.modelContent?.sessionState;if(['Nothing recorded','One session','Two sessions'].includes(value)&&value!==states.day){states.day=value;renderAll();}});
})();
</script>
