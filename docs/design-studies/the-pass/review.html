 added up.",idea:"Two capsule heads leave a rhythmic stitched line. The separated marks suggest accumulated sessions as well as motion, without pretending to be a heart-rate trace.",watch:"Avoid reading as an audio equalizer. Heads need noticeably more weight than the stitches.",lane:7,bg:"#819486",fg:"#fafaf7",rival:"#283e33"},{id:"paper-darts",name:"Paper darts",family:"Graphic",trail:!0,line:"A sharper kind of forward.",idea:"Two upright folded chevrons pull away on narrow vertical flight paths. The small fold brings a little physicality without adding a glossy material system.",watch:"Can imply navigation or sending a message. Test the pair together, never the dart alone.",lane:7,bg:"#282f2c",fg:"#f1c75b",rival:"#b6c4b8"},{id:"elastic-sparks",name:"Elastic sparks",family:"Character",trail:!0,line:"Energy with a softer edge.",idea:"Two four-point sparks stretch upward with elastic tails. This is an alternate star language: simpler and more abstract than Ember, with broad curves that remain tactile.",watch:"This is a new symbol, not a replacement Ember rig. Sparkle is a common category cue.",lane:2,bg:"#f1c75b",fg:"#282f2c",rival:"#fffdf4"},{id:"little-rivals",name:"Little rivals",family:"Character",trail:!0,line:"Friendly faces. Serious little race.",idea:"Soft bean-shaped racers with tiny eyes and a comic wake. A deliberately playful end of the spectrum, with a small raised edge that can extend into lane tokens.",watch:"Faces are a bonus at large sizes. The two offset bean silhouettes must remain legible without them.",lane:5,bg:"#e6ece1",fg:"#f1c75b",rival:"#819486"},{id:"open-track",name:"Open track",family:"Essential",trail:!1,line:"The field becomes the mark.",idea:"Two tokens sit between three open lane rules. No speed trail: the empty track and relative positions supply the story. Closest to a tiny view of the actual application.",watch:"Extra lane lines compete with the heads at favicon scale. The icon may need a simpler micro version.",lane:6,bg:"#fafaf7",fg:"#282f2c",rival:"#b39a51"},{id:"pass-notch",name:"Pass notch",family:"Graphic",trail:!1,line:"One interlocking, upward emblem.",idea:"A pair of broad, offset arches interlock into a single silhouette. The open notch preserves two identities while the taller arch records the pass. A more abstract, badge-like direction.",watch:"The overtaking story is less immediate; the upside is a distinct solid silhouette.",lane:0,bg:"#282f2c",fg:"#f1c75b",rival:"#fafaf7"},{id:"ot",name:"OT / lead swap",family:"Type",trail:!1,line:"Two letters, two starting positions.",idea:"A custom O sits lower than a strong T. The crossbar of the T pulls up and out of the O\u2019s field. The abbreviation has enough weight to behave as a symbol.",watch:"OT is not unique to Overtaek. It will need the full name in surrounding brand touchpoints.",lane:0,bg:"#f1c75b",fg:"#282f2c",rival:"#282f2c"},{id:"passing-o",name:"The passing O",family:"Type",trail:!1,line:"One letter. Two speeds.",idea:"A heavy open O is split by an upward passing stroke. A single-letter option that pairs with the full Overtaek wordmark on the website without squeezing it into an icon.",watch:"A diagonal can read as a power button or zero. The rounded vertical passing stroke is intentional.",lane:6,bg:"#282f2c",fg:"#f1c75b",rival:"#fafaf7"},{id:"club-stamp",name:"OV / TK",family:"Type",trail:!1,line:"The name, reduced to a club stamp.",idea:"Four bespoke outlined letters in two staggered rows. This tests the typographic territory directly against the symbols, using a compact shorthand rather than unreadable full-name text.",watch:"Highest reading effort of the set. Treat 24 px recognition as a real elimination test.",lane:5,bg:"#fafaf7",fg:"#282f2c",rival:"#b39a51"}],Ta=[{name:"Quiet pursuit",icon:"twin-trails",mode:"trail",line:"The clearest bridge from icon to interface.",idea:"An open field, fine distance rules and two-weight tokens. Short downward trails repeat the app mark. All five athletes remain in their own lane du
