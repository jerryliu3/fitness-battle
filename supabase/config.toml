project_id = "fitness-battle"

[api]
enabled = true
# 54321/54322 are taken by the Resolution local stack.
port = 54621
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54622
shadow_port = 54620
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54623

[inbucket]
enabled = true
port = 54624

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:8081/**",
  "overtaek://**",
  "fitnessbattle://**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
