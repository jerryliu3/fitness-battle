# Build Overtaek iOS on EAS and upload to TestFlight.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   EXPO_ACCESS_TOKEN  — Expo account access token (required)
#
# App Store Connect Apple ID lives in apps/mobile/eas.json
# (submit.production.ios.ascAppId). Apple signing must already live in EAS
# (from a prior interactive Mac build).
#
# Optional (only if iOS credentials need repair on CI):
#   EXPO_ASC_API_KEY_PATH / EXPO_ASC_KEY_ID / EXPO_ASC_ISSUER_ID /
#   EXPO_APPLE_TEAM_ID / EXPO_APPLE_TEAM_TYPE

name: EAS iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/eas-ios-testflight.yml"

concurrency:
  group: eas-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit iOS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build iOS (production)
        env:
          # app.json has no custom dev client; silence Expo Go production warning
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Submit to TestFlight
        # --latest selects the newest EAS iOS build. Do not pass --id here:
        # that flag is the EAS build UUID, not the App Store Connect Apple ID.
        # ascAppId comes from eas.json submit.production.ios.
        run: eas submit --platform ios --profile production --latest --non-interactive --wait
