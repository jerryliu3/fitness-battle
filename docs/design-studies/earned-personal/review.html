&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#earned-personal .ep-track{height:7px;background:var(--ep-soft);border-radius:8px;overflow:hidden;display:flex}
#earned-personal .ep-track span{height:100%;background:var(--ep-gold)}
#earned-personal .ep-impact{padding:16px;background:var(--ep-soft);border-radius:14px;display:flex;flex-direction:column;gap:8px}
#earned-personal .ep-nav{border-top:1px solid var(--ep-line);margin-top:auto;padding:16px 12px;display:flex;justify-content:space-around;font-size:11px;color:var(--ep-muted)}
#earned-personal .ep-nav span{display:flex;flex-direction:column;align-items:center;gap:4px}
#earned-personal .ep-nav .ep-current{color:var(--ep-ink)}
#earned-personal .ep-nav .ep-current svg{color:var(--ep-contrast);background:var(--ep-gold);border-radius:7px;box-shadow:0 0 0 5px var(--ep-gold)}
#earned-personal .ep-clock{height:180px;display:flex;align-items:center;justify-content:space-around;position:relative;background:var(--ep-soft);border-radius:90px 90px 28px 28px;margin-top:12px}
#earned-personal .ep-clock:before{content:&#x27;&#x27;;position:absolute;inset:14px;border:1px solid var(--ep-sage);border-radius:80px 80px 20px 20px;opacity:.4}
#earned-personal .ep-clock&gt;div{z-index:1}
#earned-personal .ep-clock .ep-hero{font-size:48px}
#earned-personal .ep-seg{display:flex;background:var(--ep-soft);padding:4px;border-radius:12px;gap:3px}
#earned-personal .ep-seg button{flex:1;background:transparent;border:0;border-radius:8px;padding:7px;min-height:36px;font-size:12px}
#earned-personal .ep-seg button[aria-pressed=true]{background:var(--ep-card);box-shadow:0 2px 5px #17231e0d}
#earned-personal .ep-avatar{height:44px;width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ep-soft);border:2px solid var(--ep-card);flex:none;overflow:hidden}
#earned-personal .ep-avatar img{width:100%;height:100%;object-fit:contain}
#earned-personal .ep-avatar-stack{display:flex;padding-left:6px}
#earned-personal .ep-avatar-stack .ep-avatar{margin-left:-6px}
#earned-personal .ep-field{height:350px;position:relative;background:var(--ep-soft);border-radius:18px;overflow:hidden;padding:12px 10px;isolation:isolate}
#earned-personal .ep-field:before{content:&#x27;&#x27;;position:absolute;inset:35px 24px 10px;background:repeating-linear-gradient(to top,transparent 0,transparent 67px,color-mix(in srgb,var(--ep-sage) 22%,transparent) 67px,color-mix(in srgb,var(--ep-sage) 22%,transparent) 68px);z-index:-1}
#earned-personal .ep-ranks{display:grid;grid-template-columns:repeat(4,1fr);padding-right:24px;font-size:12px;text-align:center}
#earned-personal .ep-ranks b{font-weight:500}
#earned-personal .ep-ranks .ep-you{background:var(--ep-gold);border-radius:6px;color:var(--ep-contrast)}
#earned-personal .ep-lane{position:absolute;top:62px;bottom:10px;width:1px;background:color-mix(in srgb,var(--ep-sage) 18%,transparent)}
#earned-personal .ep-racer{position:absolute;transform:translate(-50%,-50%);width:44px;height:60px;background:color-mix(in srgb,var(--ep-platinum) 80%,transparent);border:1px solid color-mix(in srgb,var(--ep-card) 65%,var(--ep-platinum));border-radius:24px;box-shadow:inset 3px 2px 3px #ffffff80,inset -2px -3px 3px #282f2c20;display:grid;place-items:center;z-index:2;padding:0}
#earned-personal .ep-racer:first-of-type{background:var(--ep-gold)}
#earned-personal .ep-racer.ep-first{background:#ffc400}
#earned-personal .ep-racer:before{content:&#x27;&#x27;;position:absolute;left:3px;right:3px;top:15px;height:90px;border-radius:24px;background:linear-gradient(to bottom,color-mix(in srgb,var(--ep-platinum) 25%,transparent),transparent);z-index:-1}
#earned-personal .ep-racer .ep-avatar{width:30px;height:30px;background:var(--ep-card);border-width:1px}
#earned-personal .ep-racer .ep-avatar svg{width:19px;height:19px}
#earned-personal .ep-racer&gt;img{width:43px;height:52px;object-fit:contain;position:relative;top:-5px}
#earned-personal .ep-racer[aria-pressed=true]{outline:2px solid var(--ep-ink);outline-offset:4px}
#earned-personal .ep-name-tag{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:var(--ep-card);padding:3px 7px;border-radius:6px;box-shadow:0 2px 6px #17231e0a}
#earned-personal .ep-ticks{position:absolute;right:7px;top:67px;bottom:10px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--ep-muted);align-items:flex-end;pointer-events:none}
#earned-personal .ep-small-map{height:50px;background:var(--ep-soft);border-radius:12px;position:relative;margin-top:10px;overflow:hidden}
#earned-personal .ep-small-map:before{content:&#x27;&#x27;;position:absolute;left:16px;right:16px;top:24px;height:2px;background:var(--ep-sage)}
#earned-personal .ep-small-map&gt;span{position:absolute;top:8px;bottom:8px;left:38%;width:24%;background:color-mix(in srgb,var(--ep-gold) 45%,transparent);border:1px solid var(--ep-ink);border-radius:6px}
#earned-personal .ep-field.ep-far .ep-racer{width:8px;height:5px;min-height:5px;border-radius:4px;box-shadow:none;border:0}
#earned-personal .ep-field.ep-close .ep-racer{width:19px;height:24px;min-height:24px;border-radius:13px}
#earned-personal .ep-field.ep-close .ep-racer .ep-avatar{width:18px;height:18px;border:0}
#earned-personal .ep-field.ep-close .ep-racer .ep-avatar svg{width:13px;height:13px}
#earned-personal .ep-field.ep-close .ep-racer:before{left:2px;right:2px;top:6px;height:70px}
#earned-personal .ep-field.ep-far .ep-racer:before{left:1px;right:1px;top:4px;height:50px}
#earned-personal .ep-field.ep-close .ep-racer:after,#earned-personal .ep-field.ep-far .ep-racer:after{content:&#x27;&#x27;;position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
#earned-personal .ep-place-flag{position:absolute;top:-30px;left:15px;min-width:70px;background:var(--ep-card);border-radius:9px;padding:5px 9px;display:flex;align-items:center;gap:6px;font-size:11px;box-shadow:0 2px 8px #17231e10}
#earned-personal .ep-place-flag .ep-avatar{width:23px!important;height:23px!important}
#earned-personal .ep-filter{display:flex;align-items:center;gap:8px;border:0;background:var(--ep-soft);padding:6px 10px;border-radius:8px;font-size:12px!important;min-height:36px!important}
#earned-personal .ep-week{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ep-line)}
#earned-personal .ep-place{height:54px;width:52px;background:var(--ep-soft);border-radius:12px;display:grid;place-items:center;font-size:23px;letter-spacing:-1px}
#earned-personal .ep-mini-bars{height:25px;display:flex;align-items:flex-end;gap:3px;width:64px;margin-top:7px}
#earned-personal .ep-mini-bars i{flex:1;background:var(--ep-sage);border-radius:2px;min-height:2px}
#earned-personal .ep-volume-bars{height:115px;display:flex;align-items:flex-end;gap:9px;padding:12px 0 0}
#earned-personal .ep-volume-bars button{border:0;background:var(--ep-sage);border-radius:5px 5px 0 0;min-height:10px;flex:1;padding:0;position:relative}
#earned-personal .ep-volume-bars button[aria-pressed=true]{background:var(--ep-gold)}
#earned-personal .ep-chart-labels{display:flex;justify-content:space-between;color:var(--ep-muted);font-size:11px}
#earned-personal .ep-chart{width:100%;height:160px;display:block;color:var(--ep-ink)}
#earned-personal .ep-chart text{fill:var(--ep-muted);font-family:&#x27;DM Sans&#x27;,sans-serif;font-size:12px}
#earned-personal .ep-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#earned-personal .ep-calendar button{border:0;border-radius:6px;background:var(--ep-soft);aspect-ratio:1;min-height:26px;padding:0;font-size:11px}
#earned-personal .ep-calendar button.ep-trained{background:color-mix(in srgb,var(--ep-sage) 50%,var(--ep-soft))}
#earned-personal .ep-calendar button[aria-pressed=true]{background:var(--ep-gold);color:var(--ep-contrast)}
#earned-personal .ep-club{background:var(--ep-ink);color:var(--ep-paper);padding:22px;border-radius:20px;position:relative;overflow:hidden}
#earned-personal .ep-club:after{content:&#x27;&#x27;;position:absolute;width:120px;height:120px;border:1px solid color-mix(in srgb,var(--ep-paper) 20%,transparent);border-radius:50%;right:-25px;top:-40px;box-shadow:0 0 0 16px #ffffff08,0 0 0 32px #ffffff06}
#earned-personal .ep-club small{color:var(--ep-paper);opacity:.75}
#earned-personal .ep-people{display:flex;justify-content:space-between;gap:8px}
#earned-personal .ep-person{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px;font-size:12px!important}
#earned-personal .ep-person[aria-pressed=true] .ep-avatar{outline:2px solid var(--ep-ink);outline-offset:2px}
#earned-personal .ep-person .ep-avatar{width:52px;height:52px}
#earned-personal .ep-tape{height:58px;display:flex;position:relative;margin:16px 10px 24px 0;background:var(--ep-soft);border-radius:10px}
#earned-personal .ep-tape button{border:0;padding:0;background:var(--ep-sage);min-width:0;position:relative;min-height:58px}
#earned-personal .ep-tape button:first-child{border-radius:10px 0 0 10px}
#earned-personal .ep-tape button:nth-child(2){background:var(--ep-gold);color:var(--ep-contrast)}
#earned-personal .ep-tape button:nth-child(3){background:var(--ep-platinum);color:var(--ep-contrast)}
#earned-personal .ep-tape .ep-finish{position:absolute;right:0;top:-10px;bottom:-10px;width:7px;background:repeating-conic-gradient(var(--ep-ink) 0% 25%,var(--ep-paper) 0% 50%) 0 0/8px 8px}
#earned-personal .ep-tape .ep-target{position:absolute;right:-4px;top:72px;font-size:11px}
#earned-personal .ep-tape button[aria-pressed=true]:after{content:&#x27;&#x27;;position:absolute;bottom:-9px;left:calc(50% - 5px);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--ep-ink)}
#earned-personal .ep-expedition{position:relative;height:230px;background:var(--ep-soft);border-radius:18px}
#earned-personal .ep-expedition .ep-chart{height:230px}
#earned-personal .ep-expedition .ep-avatar-stack{position:absolute;left:35%;top:100px}
#earned-personal .ep-score-steps{display:flex;gap:5px;height:10px}
#earned-personal .ep-score-steps i{flex:1;background:var(--ep-soft);border-radius:3px}
#earned-personal .ep-score-steps .ep-done{background:var(--ep-gold)}
#earned-personal .ep-score-steps .ep-part{background:linear-gradient(to right,var(--ep-gold) 65%,var(--ep-soft) 65%)}
#earned-personal .ep-source-row{display:grid;grid-template-columns:1fr 80px 35px;gap:10px;align-items:center;min-height:52px}
#earned-personal .ep-source-row .ep-source-bar{height:7px;background:var(--ep-soft);border-radius:4px;overflow:hidden}
#earned-personal .ep-source-row .ep-source-bar i{display:block;height:100%;background:var(--ep-gold)}
#earned-personal .ep-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
#earned-personal .ep-phone svg[data-lucide]{width:19px;height:19px;stroke-width:1.6}
@media(max-width:420px){#earned-personal .ep-stage{padding:16px 0;min-height:0}#earned-personal .ep-body{padding:4px 18px 20px;gap:18px}#earned-personal .ep-phone{border-radius:22px;min-height:710px}#earned-personal .ep-hero{font-size:48px}#earned-personal .ep-top{padding:12px 16px}}
@media(max-width:360px){#earned-personal .ep-chart text{font-size:15px}}
