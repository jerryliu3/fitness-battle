<style>
#ember-race-flight{--el-fg:light-dark(#40234e,#fff9e9);--el-muted:light-dark(#726377,#c8b9d0);--el-line:light-dark(#d5cbd7,#6b5376);font-family:Arial,sans-serif;color:var(--el-fg);max-width:736px;margin:0 auto}

#ember-race-flight button.el-play{background:#40234e;color:#fff9e9;border-color:#40234e}
#ember-race-flight button:disabled{opacity:.5}

#ember-race-flight .el-phases{display:flex;justify-content:space-between;font-size:12px;color:var(--el-muted);padding:4px 2px}
#ember-race-flight [data-active="true"]{color:var(--el-fg);font-weight:600}
#ember-race-flight .el-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#ember-race-flight .el-motion{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ember-race-flight .el-trail,#ember-race-flight .el-streak{position:absolute;top:0;left:0;height:2px;border-radius:3px;opacity:0;transform-origin:right center;background:linear-gradient(90deg,transparent,#ffcf47)}
#ember-race-flight .el-streak{height:1px;background:linear-gradient(90deg,transparent,#fff9e9)}
#ember-race-flight .el-track{position:absolute;left:7%;right:7%;bottom:18%;height:1px;background:repeating-linear-gradient(90deg,rgba(255,249,233,.12) 0 22px,transparent 22px 54px)}
#ember-race-flight .el-track:after{content:"";position:absolute;left:50%;top:-8px;height:17px;width:2px;background:rgba(255,249,233,.18)}
@media(max-width:460px){#ember-race-flight .el-stage{height:310px;border-radius:16px}#ember-race-flight button{padding:10px 12px}#ember-race-flight .el-controls{gap:8px}}
</style>
<script>
(() => {
  const root=document.getElementById('ember-race-flight');
  const stage=root.querySelector('.el-stage'),canvas=root.querySelector('canvas'),original=root.querySelector('img');
  const play=root.querySelector('.el-play'),slow=root.querySelector('.el-slow'),scrub=root.querySelector('input');
  const loading=root.querySelector('.el-loading'),status=root.querySelector('.el-status');
  const source=document.getElementById('el-mesh');let data=JSON.parse(source.textContent);source.remove();
  original.src=data.texture;
  const gl=canvas.getContext('webgl',{alpha:false,antialias:false,depth:true,stencil:false,preserveDrawingBuffer:false,powerPreference:'low-power'});

    attribute vec3 aPosition;attribute vec2 aUv;
    uniform float uYaw;uniform float uRoll;uniform vec2 uOffset;uniform vec2 uHalf;uniform vec2 uFlex;
    varying vec2 vUv;
    void main(){

      float tip=smoothstep(.55,1.95,aPosition.y);

      p.z+=uFlex.x*.08*tip;

    precision mediump float;varying vec2 vUv;uniform sampler2D uTexture;
    void main(){
      vec3 gold=mix(vec3(1.0,.60,.12),vec3(1.0,.85,.31),clamp(vUv.y,0.0,1.0));

      }

  let program,vertexBuffer,indexBuffer,texture,observer,visibilityObserver,tweak;
  let disposed=false;
  const state={p:0,playing:false,slow:false,raf:0,lastDraw:0,start:0,initial:0,travel:2,halfW:5,halfH:3.45,angle:56,startFront:true,visible:true,wind:1,trails:true};
  function shader(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}

    if(disposed||!program||!state.visible)return;
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawElements(gl.TRIANGLES,indexCount,gl.UNSIGNED_SHORT,0);
  }
  let indexCount=0,uniforms,lastPhase='';
  const clamp=t=>Math.max(0,Math.min(1,t));
  const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
  const smoother=t=>{t=clamp(t);return t*t*t*(t*(t*6-15)+10)};
  const duration=3800;
  function motionAt(p){

  // slow playback produce the same motion. No per-frame mesh allocations.
  const springSteps=456,springs=new Float32Array((springSteps+1)*2),dt=duration/1000/springSteps;

    const m=motionAt(i/springSteps);
    const tipTarget=Math.max(-.18,Math.min(.66,.50*m.v*m.v+.18*m.a));

    springs[i*2]=tip;springs[i*2+1]=limb;
  }
  const motionLayer=root.querySelector('.el-motion');
  const trails=Array.from({length:3},()=>{const el=document.createElement('div');el.className='el-trail';motionLayer.appendChild(el);return el});
  const streaks=Array.from({length:6},()=>{const el=document.createElement('div');el.className='el-streak';motionLayer.appendChild(el);return el});
  function motionLines(m,x,y){
    const w=stage.clientWidth,h=stage.clientHeight,centerX=(x/(2*state.halfW)+.5)*w,centerY=(.5-y/(2*state.halfH))*h;
    const strength=state.trails?m.v:0,end=centerX-h/(2*state.halfH)*1.25;
    trails.forEach((el,i)=>{const length=(38+i*13)*strength;el.style.width=length+'px';el.style.transform=`translate(${end-length-i*6}px,${centerY+(i-1)*13}px)`;el.style.opacity=String(strength*(.72-i*.14))});
    const heights=[.18,.29,.73,.85,.39,.65];
    streaks.forEach((el,i)=>{
      const pos=((i*.217+.12-m.s*1.8)%1+1)%1*w;
      const clear=Math.abs(pos-centerX)>110||Math.abs(heights[i]*h-centerY)>85;
      el.style.width=(26+strength*(30+i*5))+'px';el.style.transform=`translate(${pos}px,${heights[i]*h}px)`;el.style.opacity=String(clear?strength*.16:0);
    });
  }
  function draw(p){
    if(disposed||!uniforms)return;
    state.p=clamp(p);scrub.value=String(Math.round(state.p*1000));
    const turn=state.startFront?smooth((p-.12)/.18):1;
    const m=motionAt(p),brake=smooth((p-.70)/.20);
    const bank=-.14*m.v-.14*m.a;
    const settle=p>.70&&p<1?.10*Math.sin((p-.70)*Math.PI*12)*Math.exp(-(p-.70)*14):0;
    const windup=p>.12&&p<.31?-.10*Math.sin((p-.12)/.19*Math.PI):0;
    const x=-state.travel+2*state.travel*m.s+settle+windup;
    const yaw=(state.angle*turn-8*brake)*Math.PI/180;
    const sample=clamp(p)*springSteps,i=Math.min(springSteps-1,Math.floor(sample)),blend=sample-i;
    const tipWind=p>=1?0:(springs[i*2]*(1-blend)+springs[(i+1)*2]*blend)*state.wind;
    const limbWind=p>=1?0:(springs[i*2+1]*(1-blend)+springs[(i+1)*2+1]*blend)*state.wind;
    const y=.08+m.v*.12;
    gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.roll,bank);gl.uniform2f(uniforms.offset,x,y);gl.uniform2f(uniforms.half,state.halfW,state.halfH);gl.uniform2f(uniforms.flex,tipWind,limbWind);
    render();
    motionLines(m,x,y);
    const phase=p<.31?'Ready':p<.43?'Accelerate':p<.54?'Pass':'Brake';
    if(phase!==lastPhase){root.querySelectorAll('[data-phase]').forEach(el=>el.dataset.active=String(el.dataset.phase===phase));lastPhase=phase}
    const message=p===1?'Ember has stopped.':phase+'.';if(status.textContent!==message)status.textContent=message;
    stage.dataset.frame=String(Math.round(p*1000));stage.dataset.yaw=(yaw*180/Math.PI).toFixed(1);
    stage.dataset.speed=m.v.toFixed(3);stage.dataset.tipWind=tipWind.toFixed(3);stage.dataset.limbWind=limbWind.toFixed(3);
  }
  function pause(){cancelAnimationFrame(state.raf);state.playing=false;play.textContent=state.p>.999?'Replay':state.p<.001?'Play flight':'Resume'}
  function run(){
    if(disposed)return;if(state.playing){pause();return}
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw(1);play.textContent='Replay';return}
    if(state.p>.999)state.p=0;
    state.start=performance.now();state.initial=state.p;state.lastDraw=0;state.playing=true;play.textContent='Pause';
    function tick(now){
      if(!state.playing||disposed)return;
      const p=clamp(state.initial+(now-state.start)/(duration*(state.slow?2.5:1)));
      if(now-state.lastDraw>=1000/24||p===1){draw(p);state.lastDraw=now}
      if(p<1)state.raf=requestAnimationFrame(tick);else pause();
    }
    state.raf=requestAnimationFrame(tick);
  }
  function resize(){
    if(disposed)return;
    const w=stage.clientWidth,h=stage.clientHeight,ratio=Math.min(1,640/w,360/h);
    canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);gl.viewport(0,0,canvas.width,canvas.height);
    state.halfW=state.halfH*w/h;state.travel=Math.max(.55,state.halfW-1.95);draw(state.p);
    stage.dataset.pixels=String(canvas.width*canvas.height);
  }
  function release(){
    if(disposed)return;pause();disposed=true;observer?.disconnect();visibilityObserver?.disconnect();tweak?.dispose();
    gl.deleteTexture(texture);gl.deleteBuffer(vertexBuffer);gl.deleteBuffer(indexBuffer);gl.deleteProgram(program);gl.getExtension('WEBGL_lose_context')?.loseContext();
  }
  try{
    const vs=shader(gl.VERTEX_SHADER,vertexSource),fs=shader(gl.FRAGMENT_SHADER,fragmentSource);
    program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
    vertexBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vertexBuffer);gl.bufferData(gl.ARRAY_BUFFER,decode(data.vertices),gl.STATIC_DRAW);
    const pos=gl.getAttribLocation(program,'aPosition'),uv=gl.getAttribLocation(program,'aUv');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(uv);gl.vertexAttribPointer(uv,2,gl.FLOAT,false,20,12);
    indexBuffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);const indexBytes=decode(data.indices);indexCount=indexBytes.byteLength/2;gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indexBytes,gl.STATIC_DRAW);
    uniforms={yaw:gl.getUniformLocation(program,'uYaw'),roll:gl.getUniformLocation(program,'uRoll'),offset:gl.getUniformLocation(program,'uOffset'),half:gl.getUniformLocation(program,'uHalf'),flex:gl.getUniformLocation(program,'uFlex')};
    gl.clearColor(44/255,25/255,55/255,1);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);
    texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.uniform1i(gl.getUniformLocation(program,'uTexture'),0);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    stage.dataset.vertices=String(data.vertexCount);stage.dataset.triangles=String(data.triangleCount);stage.dataset.meshBytes=String(data.bufferBytes);stage.dataset.geometry='same mesh; tip and limb flex';stage.dataset.fps='24';stage.dataset.springBytes=String(springs.byteLength);
    const image=new Image();
    image.onload=()=>{
      if(disposed)return;gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);

      observer=new ResizeObserver(resize);observer.observe(stage);
      visibilityObserver=new IntersectionObserver(entries=>{state.visible=entries[0].isIntersecting;if(!state.visible)pause();else draw(state.p)});visibilityObserver.observe(stage);

    };
    image.onerror=()=>{loading.textContent='The character texture could not load.'};image.src=data.texture;data=null;
    play.addEventListener('click',run);
    slow.addEventListener('click',()=>{const was=state.playing;pause();state.slow=!state.slow;slow.setAttribute('aria-pressed',String(state.slow));slow.textContent=state.slow?'Normal speed':'Slow motion';if(was)run()});
    scrub.addEventListener('input',()=>{pause();draw(Number(scrub.value)/1000);pause()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else draw(state.p)});
    canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();pause();play.disabled=true;loading.textContent='Preview paused to save graphics memory.'});
    window.addEventListener('pagehide',release,{once:true});
    if(globalThis.Tweak){tweak=new Tweak({container:root,onChange:()=>draw(state.p)});tweak.addSlider(state,'wind',{label:'Wind response',min:0,max:1.5,step:.1});tweak.addToggle(state,'trails',{label:'Motion trails'});tweak.addSlider(state,'angle',{label:'Flight angle',min:35,max:75,unit:'°'})}
  }catch(error){loading.textContent='The 3D preview could not start.';console.error(error);release()}
})();
</script>
