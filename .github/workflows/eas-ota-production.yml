# Publish a production Expo Update (JS bundle) without a new App Store binary.
#
# Billing: `eas update` does NOT use the Free plan's 15 iOS / 15 Android *build*
# credits. Updates are unlimited; Free tier is capped by ~1k MAUs/month and ~100 GiB
# bandwidth (see docs/expo-setup.md). This job only runs `eas update`, never `eas build`.
#
# Requires EXPO_ACCESS_TOKEN when running (repo secret or manual dispatch without it
# will fail auth — intentional if you only publish OTA from a laptop).
# Only devices on a binary built with eas.json → build.production.channel "production"
# and a matching runtimeVersion (app.json version) receive the update.

name: EAS Update (production)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/pursuit/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: eas-ota-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish production OTA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_PUBLIC_USE_DEMO_DATA: "false"
          EXPO_PUBLIC_API_URL: "https://fitness-battle-one.vercel.app"
          EXPO_PUBLIC_SUPABASE_URL: "https://pxruixccvrykhbjzjqga.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_qDgv-txtSFPU4VatDc1CGQ_2SwG-Po9"
          EXPO_PUBLIC_RANKINGS_SUPABASE_URL: "https://nevwdslqilysyeaccptz.supabase.co"
          EXPO_PUBLIC_RANKINGS_SUPABASE_ANON_KEY: "sb_publishable_D9343Y1mDcEg0_vTy1ASGA_yQSXR_sA"
        run: eas update --channel production --environment production --non-interactive --message "main ${{ github.sha }}"
