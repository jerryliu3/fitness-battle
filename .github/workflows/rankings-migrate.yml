name: Rankings database migrate

on:
  push:
    branches: [main]
    paths:
      - "rankings-db/supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: rankings-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link rankings project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN; see docs/integrations.md."
            exit 1
          fi
          supabase link --workdir rankings-db --project-ref nevwdslqilysyeaccptz
          supabase db push --workdir rankings-db --include-all --yes
