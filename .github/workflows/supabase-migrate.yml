# Apply additive Supabase migrations when they land on main.
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — project ref (e.g. pxruixccvrykhbjzjqga)
#   SUPABASE_DB_PASSWORD   — database password from Project Settings → Database
name: Supabase migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, or SUPABASE_DB_PASSWORD."
            echo "Add them under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all
