name: Rankings database migrate

on:
  push:
    branches: [main]
    paths:
      - "rankings-db/supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: rankings-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link rankings project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.RANKINGS_SUPABASE_DB_PASSWORD }}
          RANKINGS_PROJECT_REF: ${{ secrets.RANKINGS_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$RANKINGS_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing rankings project credentials; see docs/integrations.md."
            exit 1
          fi
          if [ "$RANKINGS_PROJECT_REF" != "nevwdslqilysyeaccptz" ]; then
            echo "Rankings project reference does not match the expected production project."
            exit 1
          fi
          supabase link --workdir rankings-db --project-ref "$RANKINGS_PROJECT_REF"
          supabase db push --workdir rankings-db --include-all
